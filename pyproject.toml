[project]
name = "databricks-local-ci"
version = "0.1.0"
description = "Local CI testkit for validating Databricks Python jobs before deploy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
]

[project.entry-points.pytest11]
databricks_local_ci_fixtures = "databricks_local_ci.fixtures"
databricks_local_ci_auto_real_run = "databricks_local_ci.auto_real_run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
