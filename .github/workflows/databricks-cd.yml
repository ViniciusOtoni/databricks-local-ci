name: Databricks CD

on:
  workflow_call:
    inputs:
      package_dir:
        description: "Path (relative to the caller repo root) to the bundle/job package"
        required: true
        type: string
      bundle_target:
        description: "Databricks Asset Bundle target to deploy, e.g. prod"
        required: true
        type: string
      artifact_name:
        description: "Name of the wheel artifact to download, produced by databricks-ci.yml"
        required: false
        type: string
        default: "databricks-wheel"
      auth_method:
        description: "How to authenticate to Databricks: 'oidc' (Service Principal via GitHub OIDC, needs an account console) or 'pat' (personal access token, works on Free Edition)"
        required: false
        type: string
        default: "oidc"
    secrets:
      databricks_host:
        required: true
      databricks_client_id:
        required: false
      databricks_token:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.package_dir }}/dist

      - uses: databricks/setup-cli@v1.12.1

      - name: Deploy bundle (OIDC Service Principal)
        if: ${{ inputs.auth_method == 'oidc' }}
        working-directory: ${{ inputs.package_dir }}
        env:
          DATABRICKS_HOST: ${{ secrets.databricks_host }}
          DATABRICKS_CLIENT_ID: ${{ secrets.databricks_client_id }}
          DATABRICKS_AUTH_TYPE: github-oidc
        run: databricks bundle deploy --target ${{ inputs.bundle_target }}

      - name: Deploy bundle (personal access token)
        if: ${{ inputs.auth_method == 'pat' }}
        working-directory: ${{ inputs.package_dir }}
        env:
          DATABRICKS_HOST: ${{ secrets.databricks_host }}
          DATABRICKS_TOKEN: ${{ secrets.databricks_token }}
        run: databricks bundle deploy --target ${{ inputs.bundle_target }}
