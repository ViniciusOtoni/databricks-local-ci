[project]
name = "example-job"
version = "0.1.0"
description = "Reference Databricks Job used to demonstrate databricks-local-ci"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
example-job = "example_job.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "databricks-local-ci @ git+https://github.com/ViniciusOtoni/databricks-local-ci.git@master",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.databricks-local-ci]
entry_point = "example_job.main"

[tool.databricks-local-ci.sample_input]
columns = ["category", "amount"]
rows = [
    ["books", 10.0],
    ["books", 5.0],
    ["toys", 20.0],
]
